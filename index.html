<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جرد الدكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<section id="authScreen" class="screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon">🏪</span>
      <h1>جرد الدكان</h1>
      <p class="brand-sub">سجل دخولك لمتابعة جردك اليومي</p>
    </div>

    <form id="loginForm" class="auth-form">
      <label>
        اسم المستخدم
        <input type="text" id="loginUsername" autocomplete="username" required>
      </label>
      <label>
        كلمة المرور
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="form-error"></p>
      <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
    </form>

    <button id="showSignup" class="link-btn">ما عندك حساب؟ إنشاء حساب جديد</button>

    <form id="signupForm" class="auth-form hidden">
      <label>
        اسم المستخدم
        <input type="text" id="signupUsername" required>
      </label>
      <label>
        كلمة المرور
        <input type="password" id="signupPassword" required>
      </label>
      <label>
        تأكيد كلمة المرور
        <input type="password" id="signupPasswordConfirm" required>
      </label>
      <p id="signupError" class="form-error"></p>
      <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
    </form>

    <button id="showLogin" class="link-btn hidden">رجوع لتسجيل الدخول</button>
  </div>
</section>

<!-- ===== الشاشة الرئيسية: الجرد ===== -->
<section id="mainScreen" class="screen hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-icon small">🏪</span>
      <h1>جرد الدكان</h1>
    </div>
    <div class="topbar-user">
      <span id="welcomeUser" class="welcome"></span>
      <button id="logoutBtn" class="btn btn-ghost">تسجيل الخروج</button>
    </div>
  </header>

  <main class="content">
    <p id="todayDate" class="today-date"></p>

    <div class="card entry-card">
      <div class="field-grid">
        <label class="field">
          <span>كاش أمس</span>
          <div class="input-money">
            <input type="number" id="cashYesterday" min="0" step="0.01" placeholder="0.00">
            <span class="currency">د.أ</span>
          </div>
        </label>
        <label class="field">
          <span>كاش اليوم</span>
          <div class="input-money">
            <input type="number" id="cashToday" min="0" step="0.01" placeholder="0.00">
            <span class="currency">د.أ</span>
          </div>
        </label>
        <label class="field">
          <span>مشتريات اليوم</span>
          <div class="input-money">
            <input type="number" id="purchases" min="0" step="0.01" placeholder="0.00">
            <span class="currency">د.أ</span>
          </div>
        </label>
        <label class="field">
          <span>مصاريف اليوم</span>
          <div class="input-money">
            <input type="number" id="expenses" min="0" step="0.01" placeholder="0.00">
            <span class="currency">د.أ</span>
          </div>
        </label>
      </div>

      <div class="result-box">
        <span class="result-label">مبيعات اليوم</span>
        <span id="salesResult" class="result-value">0.00 د.أ</span>
      </div>

      <p id="profitNote" class="profit-note"></p>

      <button id="saveBtn" class="btn btn-primary btn-wide">حفظ جرد اليوم</button>
      <p id="saveMsg" class="save-msg"></p>
    </div>

    <button id="goRecords" class="btn btn-outline btn-wide">سجل الجرد</button>
  </main>
</section>

<!-- ===== شاشة سجل الجرد ===== -->
<section id="recordsScreen" class="screen hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-icon small">📒</span>
      <h1>سجل الجرد</h1>
    </div>
    <div class="topbar-user">
      <span id="welcomeUser2" class="welcome"></span>
      <button id="logoutBtn2" class="btn btn-ghost">تسجيل الخروج</button>
    </div>
  </header>

  <main class="content">
    <button id="backToMain" class="link-btn back-link">← رجوع للجرد</button>

    <div class="card table-card">
      <table id="recordsTable">
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>كاش أمس</th>
            <th>كاش اليوم</th>
            <th>المشتريات</th>
            <th>المصاريف</th>
            <th>المبيعات</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <p id="noRecords" class="no-records hidden">ما في جرد محفوظ لهسا. ابدأ بحفظ أول يوم من صفحة الجرد.</p>
    </div>
  </main>
</section>

<!-- ===== نافذة تفاصيل اليوم ===== -->
<div id="detailModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button id="closeModal" class="modal-close">✕</button>
    <h2 id="modalDate"></h2>
    <div class="modal-grid" id="modalBody"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
